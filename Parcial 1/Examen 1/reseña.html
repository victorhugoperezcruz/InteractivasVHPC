<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Reseña | Movie Reviews</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	</head>
	<body data-page="detail">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
			<div class="container">
				<a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><span class="badge rounded-circle text-bg-danger p-2"><i class="bi bi-play-fill"></i></span><span>Movie<span class="text-danger">Reviews</span></span></a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
				<div class="collapse navbar-collapse" id="mainNav">
					<div class="navbar-nav me-auto ms-lg-4"><a class="nav-link" href="index.html">Inicio</a><a class="nav-link active" href="index.html#featured">Explorar</a></div>
					<div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 ms-lg-auto mt-3 mt-lg-0"><div class="input-group input-group-sm flex-nowrap"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="searchInput" class="form-control" type="search" style="width: 190px;" placeholder="Busca una pelicula..." aria-label="Buscar peliculas"></div><button class="btn btn-outline-light btn-sm d-inline-flex align-items-center justify-content-center gap-2 text-nowrap" data-bs-toggle="modal" data-bs-target="#favoritesModal" type="button"><i class="bi bi-heart-fill"></i><span>Favoritos</span><span class="badge text-bg-danger" id="favoriteCount">0</span></button></div>
				</div>
			</div>
		</nav>

		<main class="container py-5 mt-5">
				<div id="detailLoading" class="text-center py-5"><div class="spinner-border text-danger" role="status"><span class="visually-hidden">Cargando...</span></div><p>Abriendo reseña...</p></div>
				<div id="detailError" class="text-center py-5 d-none"><i class="bi bi-exclamation-circle fs-1 text-danger"></i><h2>No encontramos esa pelicula</h2><p>Puede que el enlace haya caducado o que la pelicula ya no este disponible.</p><button id="retryButton" class="btn btn-danger" type="button">Reintentar</button></div>
				<article id="detailContent" class="detail-content d-none"></article>
			</div>
		</main>

		<div class="modal fade" id="favoritesModal" tabindex="-1" aria-labelledby="favoritesModalLabel" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><div><p class="text-danger text-uppercase fw-bold small mb-1">Tu lista personal</p><h2 class="modal-title" id="favoritesModalLabel">Favoritos</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><div id="favoritesGrid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div><div id="favoritesEmpty" class="text-center py-5 d-none"><i class="bi bi-heart"></i><h3>Aun no tienes favoritos</h3><p>Guarda una pelicula para verla aqui.</p></div></div><div class="modal-footer"><button id="clearFavorites" class="btn btn-outline-danger" type="button"><i class="bi bi-trash3"></i> Eliminar todos</button></div></div></div></div>

		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="app.js"></script>
	</body>
</html>
